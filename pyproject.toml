[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortivra"
version = "0.1.0"
description = "A multi-scale differentiable physics and biophysics discovery sandbox."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Brad Harris", email = "bradharris4523@gmail.com" }
]
keywords = [
    "computational-neuroscience",
    "differentiable-physics",
    "port-hamiltonian",
    "biophysics",
    "symbolic-regression",
    "meta-ai",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "torch>=2.2.0",
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cortivra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
